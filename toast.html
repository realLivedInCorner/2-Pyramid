<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-Pyramid Toast</title>
    <style>
      /* Reset / transparent background so the window itself stays
         invisible — the rounded card is the only thing visible. */
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent !important;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      /* Toast card animates in from the right + fades. Compact
         notification sizing — no oversized panel. */
      .toast-card {
        position: fixed;
        inset: 0;
        display: flex;
        gap: 10px;
        padding: 10px 30px 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.18),
          0 4px 10px rgba(0, 0, 0, 0.10),
          inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: toast-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
        overflow: hidden;
      }
      .toast-card.leaving {
        animation: toast-out 260ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateX(40px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      @keyframes toast-out {
        from {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateX(40px) scale(0.96);
        }
      }
      .toast-icon {
        flex: 0 0 30px;
        width: 30px; height: 30px;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        font-size: 15px;
        background: var(--theme-color, #007bff);
        box-shadow: 0 4px 12px color-mix(in srgb, var(--theme-color, #007bff) 35%, transparent);
      }
      .toast-icon.success { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35); }
      .toast-icon.error   { background: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35); }
      .toast-icon.warning { background: #f59e0b; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
      .toast-icon.info    { background: #007bff; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.35); }
      .toast-body {
        flex: 1 1 auto; min-width: 0;
        display: flex; flex-direction: column; gap: 4px;
      }
      .toast-title {
        font-size: 13px; font-weight: 700;
        color: #0f172a;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .toast-text {
        font-size: 12px; font-weight: 500;
        color: #475569;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .toast-progress {
        position: absolute;
        left: 0; bottom: 0;
        height: 3px; width: 100%;
        background: var(--theme-color, #007bff);
        opacity: 0.85;
        transform-origin: left;
        animation: toast-progress linear forwards;
      }
      @keyframes toast-progress {
        from { transform: scaleX(1); }
        to   { transform: scaleX(0); }
      }
      .toast-close {
        position: absolute;
        top: 6px; right: 6px;
        width: 20px; height: 20px;
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
        color: #64748b;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        border: none;
        transition: background 0.15s, color 0.15s;
      }
      .toast-close:hover { background: rgba(0,0,0,0.08); color: #0f172a; }

      /* Action buttons row (e.g. “Open output folder”). Shown only
         when the payload includes `actions`. Hidden otherwise so the
         toast stays compact for plain status messages. */
      .toast-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .toast-action-btn {
        border: none;
        background: color-mix(in srgb, var(--theme-color, #007bff) 12%, transparent);
        color: var(--theme-color, #007bff);
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s, transform 0.12s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .toast-action-btn:hover {
        background: color-mix(in srgb, var(--theme-color, #007bff) 20%, transparent);
      }
      .toast-action-btn:active { transform: scale(0.96); }
      .toast-action-btn i { font-size: 14px; }

      /* Cursor + hover affordance on the whole card to advertise that
         the toast is clickable. Without it users don't realise the
         card itself focuses the main window. */
      .toast-card.clickable { cursor: pointer; }
      .toast-card.clickable:hover {
        background: rgba(255, 255, 255, 1);
        box-shadow:
          0 16px 36px rgba(0, 0, 0, 0.22),
          0 6px 14px rgba(0, 0, 0, 0.12),
          inset 0 0 0 1px rgba(0, 0, 0, 0.05);
      }
      /* The default right padding already clears the close button;
         action rows sit below the text inside the body. */
      .toast-card.has-actions { padding-right: 30px; }
    </style>
  </head>
  <body>
    <div id="toast" class="toast-card">
      <div id="toast-icon" class="toast-icon info">
        <i id="toast-icon-i" class="ri-information-line"></i>
      </div>
      <div class="toast-body">
        <div id="toast-title" class="toast-title">2-Pyramid</div>
        <div id="toast-text" class="toast-text"></div>
        <div id="toast-actions" class="toast-actions"></div>
      </div>
      <div id="toast-progress" class="toast-progress"></div>
      <button class="toast-close" id="toast-close" aria-label="Close">×</button>
    </div>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
