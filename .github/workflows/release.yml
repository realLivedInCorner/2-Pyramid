name: Release

# 触发：推送带**渠道前缀**的 tag。
#
# 前缀不是装饰，是更新器的协议 —— `src-tauri/src/updater.rs` 的 `parse_tag`
# 按第一个 `-` 前的内容决定优先级与通道：
#
#     Safe-2.0.2      强制安装（Safe）
#     Stable-2.0.2    稳定通道
#     UnStable-*      测试通道
#     Beta-*          测试通道
#     v2.0.1          无前缀，按普通处理
#
# 所以**不能只写 `v*`**：那样打出来的 tag 会落进「无前缀」分支，
# `is_test_tag` 也认不出测试版，渠道就错了。
#
# 为什么用 tag 而不是 push 到 master：发布是显式动作。版本号、CHANGELOG、
# news 文件三者的就绪状态无法在 push 那一刻判定，tag 是人说「这一版发了」。
on:
  push:
    tags:
      - 'Stable-*'
      - 'Safe-*'
      - 'Beta-*'
      - 'UnStable-*'

# 创建 Release 需要写权限；默认的 GITHUB_TOKEN 是只读的。
permissions:
  contents: write

jobs:
  release:
    # 必须 Windows：这是 Windows 桌面应用，NSIS 目标与 installer-app
    # 都只能在 Windows 上编。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag、渠道与 news 文件
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          # 渠道前缀 → 版本号。与 updater.rs 的 parse_tag 保持同一套规则，
          # 两处不一致就会出现「tag 说是 Beta，更新器当成 Stable」。
          $prefix = ($tag -split '-')[0]
          $version = $tag.Substring($prefix.Length + 1)

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "无法从 tag '$tag' 解析出版本号"
          }

          # Safe-/Stable-/UnStable-/Beta- 是渠道前缀；其余按无前缀处理，
          # 与 updater 的 strip_v 行为一致（去掉前导 v）。
          $channel = switch ($prefix) {
            'Safe'     { 'Safe' }
            'Stable'   { 'Stable' }
            'UnStable' { 'Beta' }
            'Beta'     { 'Beta' }
            default    { 'Stable' }
          }
          $isBeta = $channel -eq 'Beta'

          $news = "docs/compose/releases/news-$version.md"
          if (-not (Test-Path $news)) {
            Write-Host "::error::找不到 $news"
            Write-Host "发布前需要先在 docs/compose/releases/ 下写好这一版的说明。现有文件："
            Get-ChildItem docs/compose/releases -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          # 标题格式来自 tools/release/README.md 的发布清单：
          #     --title "2-Pyramid Stable x.y.z-BUILDnnnnn"
          # BUILD 取自仓库文件（构建只读不写），所以这里读到的就是产物里的编号。
          $build = (Get-Content BUILD -Raw).Trim()
          $product = if ($isBeta) { "2-Pyramid Beta $version-BUILD$build" }
                     else         { "2-Pyramid Stable $version-BUILD$build" }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "is_beta=$($isBeta.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "news=$news" >> $env:GITHUB_OUTPUT
          "title=$product" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag  版本=$version  渠道=$channel  BUILD=$build"
          Write-Host "标题=$product"
          Write-Host "news=$news（$((Get-Item $news).Length) 字节）"

      - name: 校验版本号与仓库一致
        shell: pwsh
        run: |
          # 版本号散落在 10 处，tag 与 package.json 不一致说明漏改了某一步。
          # 这个脚本的头部记录过一次真实事故：installer-app 漏改，
          # 导致「2.7.0 的安装包显示成 2.6.0」。
          python tools/set_version.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 两个 crate 各自的工作目录。
          #
          # 为什么不用 actions/cache 手写：手写要缓存整个 `src-tauri/target`，
          # 那是 776 MB（实测），而且 Cargo.lock 一变就存一份新的 ——
          # GitHub 免费额度是 10 GB/仓库，十几次发布就撑满，
          # 之后旧缓存被挤掉，又回到冷启动，且更难预测。
          # 这个 action 只缓存依赖与 ~/.cargo，体积小一个量级，
          # 并按工具链/哈希/profile 分层，不会每次锁文件一变就存整份。
          #
          # **它解决不了 tag 之间的缓存隔离。** GitHub 的缓存按 ref 作用域，
          # `v2.201.0` 存的缓存 `Stable-2.201.0` 读不到（实测：键完全一致，
          # 连 restore-keys 前缀都没匹配到，日志写 `Cache not found`）。
          # 所以每次发布仍是冷编译，约 12 分钟 —— 这是 tag 触发式发布的固有代价。
          # 要消除它只能从 master 预热，但那要给每次推送都加一轮完整编译，
          # 为省发布时的几分钟不值得。
          workspaces: |
            src-tauri -> target
            installer-app/src-tauri -> target

      - name: 安装前端依赖
        shell: pwsh
        run: |
          # PowerShell 默认**不因非零退出码中止**，于是 `npm ci` 失败后这一步
          # 会「成功」，错误在二十行之后才以「vue-tsc 找不到」的形式冒出来。
          # 第一次跑发布就是这个样子。显式设置，让失败停在它发生的地方。
          $ErrorActionPreference = 'Stop'

          # package-lock.json 的 resolved URL 现在指向 registry.npmjs.org；
          # 这里再固定一次，避免运行器或缓存引入别的源。
          npm config set registry https://registry.npmjs.org/
          npm config set replace-registry-host always

          cmd /c npm ci
          if ($LASTEXITCODE -ne 0) { throw "根目录 npm ci 失败（exit $LASTEXITCODE）" }

          # 装完就验：缺了 vue-tsc 的话，vue-tsc -b 会在后面才炸
          if (-not (Test-Path "node_modules/.bin/vue-tsc.cmd") -and
              -not (Test-Path "node_modules/.bin/vue-tsc")) {
            throw "node_modules/.bin 里没有 vue-tsc —— 依赖没有装全"
          }

          if (Test-Path installer-app/package.json) {
            # installer-app 没有 lock 文件，所以用 install 而不是 ci
            Push-Location installer-app
            cmd /c npm install
            if ($LASTEXITCODE -ne 0) { throw "installer-app 依赖安装失败（exit $LASTEXITCODE）" }
            Pop-Location
          }

      - name: 构建安装包（不含 MSIX）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # --skip-msix：**这是有意的分工**。
          #
          # MSIX 需要 Windows SDK 的 makeappx，商店包由商店侧签名，
          # 签名相关的材料不该出现在运行器上。远程只出 EXE，
          # MSIX 在本地用同一条流水线打（不加 --skip-msix）。
          #
          # 不加 --bump：BUILD 取自仓库里提交的值，构建只读不写，
          # 这样 CI 的 EXE 与本地 MSIX 编号一致 —— 它们是同一版本的两半。
          python tools/build_release.py --skip-msix
          if ($LASTEXITCODE -ne 0) { throw "构建失败（exit $LASTEXITCODE）" }
        env:
          CI: true

      - name: 收集产物
        id: artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 发布清单第 51 行：资产**只发 EXE + .sha256**，
          # 应用内更新器默认强制校验 .sha256（拿不到校验文件时用户可显式跳过）；MSIX 不进 Releases。
          $files = @()
          $files += Get-ChildItem release -Filter "2-Pyramid-Installer-*.exe" -ErrorAction SilentlyContinue
          $files += Get-ChildItem release -Filter "2-Pyramid-Installer-*.exe.sha256" -ErrorAction SilentlyContinue

          # 只挑这一版的，避免把历史产物一起传上去
          $files = $files | Where-Object { $_.Name -like "*${{ steps.meta.outputs.version }}*" }

          if ($files.Count -lt 2) {
            Write-Host "::error::release/ 下没找到这一版的安装包与校验文件（需要 2 个，找到 $($files.Count) 个）"
            Write-Host "release/ 内容："
            Get-ChildItem release -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          $files | ForEach-Object { Write-Host "  产物：$($_.Name)  $([math]::Round($_.Length/1MB,2)) MB" }
          # GITHUB_OUTPUT 要求 `name=value`；gh release create 用空格分隔接收
          "paths=$($files.FullName -join ' ')" >> $env:GITHUB_OUTPUT

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          # 同一个 tag 已有 Release 就停下，避免重跑时覆盖已发布的内容
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "$tag 已存在 Release。要改内容请先在网页上删除它，或手动编辑。"
          }

          $files = "${{ steps.artifacts.outputs.paths }}" -split ' '
          $ghArgs = @(
            'release', 'create', $tag,
            '--title', "${{ steps.meta.outputs.title }}",
            '--notes-file', "${{ steps.meta.outputs.news }}",
            '--verify-tag'
          )
          # 稳定版标 latest；测试版标 prerelease。
          # 这与 updater 的 is_test_tag（认 UnStable-/Beta-）是同一套语义。
          if ("${{ steps.meta.outputs.is_beta }}" -eq 'true') {
            $ghArgs += '--prerelease'
          } else {
            $ghArgs += '--latest'
          }

          gh @ghArgs @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（exit $LASTEXITCODE）" }

      - name: 输出结果
        shell: pwsh
        run: |
          @"
          ### 已发布 ${{ steps.meta.outputs.title }}

          - tag：``${{ github.ref_name }}``（渠道前缀 ${{ steps.meta.outputs.channel }}）
          - 正文：``${{ steps.meta.outputs.news }}``
          - 资产：安装包 EXE 与 ``.sha256``（应用内更新器默认强制校验后者，拿不到校验文件时用户可显式跳过）

          **MSIX 不在本工作流内**，也不进 Releases —— 它需要 Windows SDK 的 makeappx，
          商店包由商店侧签名。本地用同一条流水线打：``python tools/build_release.py --skip-installer``
          "@ >> $env:GITHUB_STEP_SUMMARY
