<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-Pyramid%VITE_BETA_MARK%</title>
  </head>

  <body>
    <!--
      ══ 加载页 ══════════════════════════════════════════════════════════
      构成照莱茵生命的 loading：品牌锁定 + 一条 1px 轨道。
      重点是**背景色与首页完全相同**（#f4f2ee）—— 过渡时不需要换色，
      于是加载页和首页读起来是同一个空间，而不是两张贴在一起的图。

      标识必须和名字、标语一起出现。单放一个图形的话，
      这个斜的形没有文字锚定，会被读成「一个歪掉的东西」而不是 logo。

      .boot-mark 同时也是飞行动画的载体：App.vue 会量出首页 .brand-mark 的位置，
      给这里加 transform 让它飞过去。所以两边的 logo 必须是同一份资源
      （public/logo-mark.png，与 src/assets/logo-512.png 同图）。
    -->
    <div class="boot" id="boot-screen">
      <div class="boot-mark"><img src="/logo-mark.png" alt="" /></div>
      <h1 class="boot-name">2-Pyramid<span class="boot-beta">%VITE_BETA_MARK%</span></h1>
      <p class="boot-tag" id="boot-tag">现代化通用多版本资源包转换器</p>
      <div class="boot-bar"><i></i></div>
    </div>
    <script>
      (function () {
        var lang = localStorage.getItem('language') || 'zh-CN';
        document.documentElement.lang = lang;
        var tag = document.getElementById('boot-tag');
        if (tag) {
          tag.textContent = lang === 'en-US'
            ? 'Universal Multi-Version Resource Pack Converter'
            : '多版本通用材质包转换器';
        }
        document.getElementById('boot-screen').dataset.start = Date.now();
      })();
    </script>
    <div id="app"></div>
    <style>
      :root { --theme-color: #14171a; --boot-bg: #f4f2ee; }
      /*
       * 这里用字面量而不是 var(--bg)：index.html 在 shared.css 之前解析，
       * 令牌还没定义。启动页只有这一屏，单独维护一份可以接受 ——
       * 但必须和 shared.css 的 --bg / 深色值保持一致，否则深色下会闪一下浅色。
       */
      html, body {
        overflow: hidden;
        background-color: var(--boot-bg);
      }
      html[data-theme='dark'] { --boot-bg: #1a1815; }

      .boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* 底板单独一层：只淡出它，飞行的 logo 不受影响 */
      .boot::before {
        content: ""; position: absolute; inset: 0;
        background: #f4f2ee;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .boot > * { position: relative; z-index: 1; }

      /* 132px 盒子里墨迹只占约 46%×50%（图形四周留白很大），所以视觉大小约 61px */
      .boot-mark { width: 132px; height: 132px; }
      .boot-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }

      .boot-name {
        margin: 6px 0 0;
        font-size: 30px; font-weight: 700; letter-spacing: -0.025em;
        line-height: 1.1; color: #14171a;
        transition: opacity 220ms ease;
      }
      .boot-beta {
        font-size: 15px; font-weight: 800; color: #ea580c;
        margin-left: 8px; vertical-align: 4px;
      }

      .boot-tag {
        margin: 10px 0 0;
        font-size: 12px; font-weight: 400; letter-spacing: 0.04em;
        color: #7d776d;
        transition: opacity 220ms ease;
      }

      /* 1px 轨道 + 60px 滑块：莱茵的进度指示就是这个量级，不做大 */
      .boot-bar {
        width: 180px; height: 1px; position: relative; overflow: hidden;
        margin-top: 46px;
        background: rgba(120, 110, 95, 0.22);
        transition: opacity 220ms ease;
      }
      .boot-bar i {
        position: absolute; top: 0; bottom: 0; left: 0; width: 60px;
        background: #14171a;
        animation: boot-slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-slide {
        from { transform: translateX(-60px); }
        to   { transform: translateX(180px); }
      }

      /* 离场：名字、标语与轨道先退，底板随后淡出；logo 由 App.vue 接管飞行 */
      .boot-leaving .boot-name,
      .boot-leaving .boot-tag,
      .boot-leaving .boot-bar { opacity: 0; }
      .boot-leaving::before { opacity: 0; }

      /* 落地的瞬间整层撤掉 —— 首页的 logo 已在同一位置接管，看不出切换 */
      .boot-gone { display: none; }

      /* 尊重「减少动效」：不做飞行，直接淡出 */
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i { animation: none; transform: translateX(60px); }
        .boot-mark { transition: opacity 200ms ease; }
        .boot-leaving .boot-mark { opacity: 0; }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
