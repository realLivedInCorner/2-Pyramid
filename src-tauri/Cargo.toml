[workspace]
members = ["."]
resolver = "2"

[package]
name = "two-pyramid"
version = "2.0.2"
description = "2-Pyramid"
authors = ["2-Pyramid Studio"]
edition = "2021"
default-run = "2-pyramid"

[lib]
name = "two_pyramid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "^2.0.0"
tauri-plugin-notification = "2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = "0.24"
fs_extra = "1.3"
tempfile = "3.10.1"
zip = "0.6"
dirs = "5"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1"
base64 = "0.22"
flate2 = "1.0"
lazy_static = "1"
tokio = { version = "1", features = ["sync", "fs", "process"] }
rayon = "1.9"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "2-pyramid"
path = "src/main.rs"

