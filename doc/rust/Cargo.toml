[package]
name = "kpt-bedrock-converter"
version = "1.0.0"
edition = "2021"
authors = ["KPT Team"]
description = "Killer Pack Translator - 基岩版转换器核心模块"
license = "MIT"
repository = "https://github.com/kpt-converter/kpt"
keywords = ["minecraft", "resourcepack", "converter", "bedrock", "java"]
categories = ["command-line-utilities", "games"]

[lib]
name = "kpt_bedrock_converter"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 压缩文件处理
zip = "0.6"

# JSON序列化/反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID生成
uuid = { version = "1.0", features = ["v4"] }

# 异步支持
tokio = { version = "1.0", features = ["full"], optional = true }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
log = "0.4"
env_logger = "0.10"

# 文件系统操作
walkdir = "2.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 正则表达式
regex = "1.0"

# C接口支持
libc = "0.2"

[dev-dependencies]
# 测试相关
tempfile = "3.0"

[features]
default = []
full = ["tokio"]
async = ["tokio"]