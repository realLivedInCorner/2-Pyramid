<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img">
  <title>2-Pyramid Logo</title>
  <desc>Triangular prism line drawing — the 2-Pyramid mark</desc>
  <style>
    .s { stroke: #000; fill: none; }
  </style>
  <g class="s">
    <!-- Outer triangle — three solid lines (slightly thicker so the line-only
         mark stays legible when rendered at small sizes like 32px favicon) -->
    <line x1="260" y1="520" x2="200" y2="390" stroke-width="7" stroke-linecap="round"/>
    <line x1="260" y1="520" x2="500" y2="190" stroke-width="7" stroke-linecap="round"/>
    <line x1="200" y1="390" x2="500" y2="190" stroke-width="7" stroke-linecap="round"/>
    <!-- Interior dividing line -->
    <line x1="260" y1="520" x2="374" y2="274" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
